name: CI & Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  WASM_PACK_VERSION: 0.15.0

# Least-privilege default; jobs opt in to more only where they need it.
permissions:
  contents: read

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    name: Build + test, Rust + WASM

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run native regression tests
        run: cargo test --target x86_64-unknown-linux-gnu --test decode_regression

      - name: Install wasm-pack
        # ~/.cargo/bin is cached above, so skip reinstalling on a cache hit -
        # `cargo install` without --force errors if the binary is already there.
        run: |
          if ! wasm-pack --version 2>/dev/null | grep -q "${{ env.WASM_PACK_VERSION }}"; then
            cargo install wasm-pack --version ${{ env.WASM_PACK_VERSION }} --locked --force
          fi

      - name: Build with wasm-pack
        run: wasm-pack build --release --target bundler

      - name: Upload built package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-pkg
          path: pkg/
          retention-days: 7

  publish-npm:
    needs: build-wasm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: Publish to npm
    environment: npm-publish
    permissions:
      id-token: write # required for npm trusted publishing (OIDC) - no long-lived token stored

    steps:
      - name: Download built package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-pkg
          path: pkg/

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish package
        working-directory: pkg
        run: npm publish
        # No NODE_AUTH_TOKEN: this repo uses npm trusted publishing (OIDC), which
        # requires a trusted publisher to be configured for this package on
        # npmjs.com (Settings -> Trusted Publishers) pointing at this exact repo
        # and workflow filename (ci.yml). See https://docs.npmjs.com/trusted-publishers/

  deploy-example:
    needs: build-wasm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Deploy example (GH Pages)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write # required for GitHub Pages OIDC deployment

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download built package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wasm-pkg
          path: pkg/

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies & build
        working-directory: example/wavy-sound-example
        run: |
          npm install
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: example/wavy-sound-example/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
